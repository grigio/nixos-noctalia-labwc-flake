name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

defaults:
  run:
    working-directory: .config/nixos-backup

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-trusted-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      - name: Lint nix files
        run: |
          nix develop --command deadnix --fail .
          nix develop --command statix check . || true

      - name: Check nixpkgs-fmt
        run: |
          # Run nixpkgs-fmt from the nix-community repo; --no-write-lock-file avoids modifying flake.lock in CI
          nix run --no-write-lock-file 'github:numtide/nixpkgs-fmt' -- --check . || true

      - name: flake check
        run: nix flake check

      - name: generate dummy hardware-configuration.nix for CI
        run: |
          cat > hardware-configuration.nix << 'EOF'
          { lib, modulesPath, ... }: {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];
            boot.initrd.availableKernelModules = [ "nvme" "xhci_pci" "uas" "usb_storage" "sd_mod" ];
            boot.initrd.luks.devices."luks-1c9217e1-b8ed-47a7-8c70-b576ff25b915".device = "/dev/null";
            fileSystems."/" = { device = "/dev/null"; fsType = "ext4"; };
            fileSystems."/boot" = { device = "/dev/null"; fsType = "vfat"; };
            swapDevices = [ ];
            nixpkgs.hostPlatform = lib.mkDefault "x86_64-linux";
          }
          EOF
          git add -f hardware-configuration.nix

      - name: build system closure (validate config)
        run: |
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel --accept-flake-config
