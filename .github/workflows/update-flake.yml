name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: .config/nixos-backup

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-trusted-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: lint nix files
        run: |
          deadnix --fail .
          statix check .

      - name: generate dummy hardware-configuration.nix for CI
        run: |
          # Generate a dummy hardware config for CI validation.
          # Must match the LUKS/device structure the main config expects.
          cat > hardware-configuration.nix << 'EOF'
          { config, lib, pkgs, modulesPath, ... }: {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];
            boot.initrd.availableKernelModules = [ "nvme" "xhci_pci" "uas" "usb_storage" "sd_mod" ];
            boot.initrd.luks.devices."luks-1c9217e1-b8ed-47a7-8c70-b576ff25b915".device = "/dev/null";
            fileSystems."/" = { device = "/dev/null"; fsType = "ext4"; };
            fileSystems."/boot" = { device = "/dev/null"; fsType = "vfat"; };
            swapDevices = [ ];
            nixpkgs.hostPlatform = lib.mkDefault "x86_64-linux";
          }
          EOF
          # Force-track the hardware config so Nix's fetchGit includes it
          # (it's gitignored and would be invisible otherwise)
          git add -f hardware-configuration.nix

      - name: update flake.lock
        run: nix flake update

      - name: commit flake.lock
        run: |
          cd "$GITHUB_WORKSPACE"
          git add .config/nixos-backup/flake.lock
          git diff --cached --quiet || git commit -m "chore: weekly flake.lock update"

      - name: build system closure (validate config)
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel --accept-flake-config

      - name: push branch
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          cd "$GITHUB_WORKSPACE"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git branch -f auto/update-flake-lock
          git push origin auto/update-flake-lock --force

      - name: create PR
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head auto/update-flake-lock \
            --title "chore: weekly flake.lock update" \
            --body "Automated weekly \`flake.lock\` update.

            - \`nix flake update\` bumped all inputs to latest.
            - Validated by building \`.config/nixos-backup#nixos\` system closure.") || true
          echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: merge PR
        if: steps.create-pr.outputs.pr-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash "${{ steps.create-pr.outputs.pr-url }}" || true
